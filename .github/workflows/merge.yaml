name: Build Jar

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package jar
        run: mvn -B package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: uva-blockbuster-jar
          path: target/*.jar
