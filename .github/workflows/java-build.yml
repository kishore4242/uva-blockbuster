name: Java Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Lint (compiler warnings as errors)
        run: mvn -B compile -Dmaven.compiler.showWarnings=true -Dmaven.compiler.failOnWarning=true
